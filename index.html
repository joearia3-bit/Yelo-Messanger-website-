<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yelo! Messenger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Yelo! Messenger</h1>
    <p>Chat with your customers and discover local businesses in Papua New Guinea.</p>
  </header>

  <nav>
    <button class="tab-button" data-tab="Chats">Chats</button>
    <button class="tab-button" data-tab="Updates">Updates</button>
    <button class="tab-button" data-tab="Calls">Calls</button>
    <button class="tab-button" data-tab="Business">Business</button>
  </nav>

  <main>
    <p id="message"></p>

    <div id="chat-area" class="hidden">
      <div id="chat-list-area">
        <h3>Requests for your business</h3>
        <ul id="incoming-list" class="list"></ul>

        <h3>Your chats</h3>
        <ul id="connection-list" class="list"></ul>
      </div>

      <div id="thread-area" class="hidden">
        <button id="thread-back" class="list-button secondary">Back to chats</button>
        <h3 id="thread-title"></h3>
        <ul id="thread-messages" class="list"></ul>
        <div class="chat-input-row">
          <input type="text" id="thread-input" placeholder="Type a message">
          <button id="thread-send">Send</button>
        </div>
      </div>

      <p id="chat-status"></p>
    </div>

    <div id="business-area" class="hidden">
      <div class="form-column">
        <h3>Your login</h3>
        <p id="account-status"></p>
        <input type="email" id="account-email" placeholder="Email">
        <input type="password" id="account-password" placeholder="Password (at least 12 characters)">
        <button id="account-save-button" class="list-button">Save login</button>
        <button id="account-signin-button" class="list-button secondary">Sign in</button>
        <button id="account-signout-button" class="list-button secondary">Sign out</button>
      </div>

      <div class="form-column">
        <h3>Register a business</h3>
        <input type="text" id="business-name" placeholder="Business name">
        <input type="text" id="business-category" placeholder="Category (for example, Coffee)">
        <input type="text" id="business-town" placeholder="Town (for example, Port Moresby)">
        <input type="text" id="business-phone" placeholder="Phone number">
        <textarea id="business-description" placeholder="Describe your business (up to 200 characters)"></textarea>
        <button id="business-save-button">Save business</button>
        <p id="business-status"></p>
      </div>

      <h3>Your businesses</h3>
      <ul id="my-business-list"></ul>

      <h3>Verified businesses</h3>
      <ul id="business-list"></ul>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
